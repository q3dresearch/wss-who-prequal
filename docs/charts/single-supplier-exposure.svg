<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="760" viewBox="0 0 1080 760" font-family='system-ui, -apple-system, "Segoe UI", sans-serif'>
<rect width="1080" height="760" fill="#fcfcfb"/>
<text x="34" y="44" font-size="21" font-weight="600" fill="#0b0b0b">17 of 56 vaccine types have exactly one prequalified manufacturer</text>
<text x="34" y="70" font-size="13.5" fill="#52514e">Every vaccine type WHO prequalifies, as one dot. Across is how many distinct manufacturers hold prequalification for it; up is how many products.</text>
<text x="34" y="89" font-size="13.5" fill="#52514e"><tspan font-weight="600" fill="#0b0b0b">Everything in the orange column is one withdrawal away from no WHO-prequalified supply at all</tspan> &#8212; and WHO records no withdrawals.</text>
<text x="34" y="108" font-size="13.5" fill="#52514e">Extra products from the same maker do not help: they are one supply chain. That is why the axis counts manufacturers, not products.</text>
<text x="34" y="127" font-size="12.5" fill="#8a8880">One capture, 2026-09.csv.gz &#8212; no archive needed to draw this. The archive is what dates the moment a dot moves left.</text>
