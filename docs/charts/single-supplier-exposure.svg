<text x="34" y="700" font-size="12" fill="#8a8880">Orange: a single manufacturer. Vertical spread inside a column is jitter so overlapping types stay countable.</text>
<text x="34" y="716" font-size="12" fill="#8a8880">ROBUST TO GRANULARITY: WHO’s type string mixes real distinctions (HPV Ninevalent vs Quadrivalent) with dose variants (Meningococcal A 5 vs 10 &#181;g). Merging the dose</text>
<text x="34" y="732" font-size="12" fill="#8a8880">and age variants gives 15 of 52 &#8212; 29% against 30%. The proportion does not depend on the choice.</text>
