<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="760" viewBox="0 0 1080 760" font-family='system-ui, -apple-system, "Segoe UI", sans-serif'>
<rect width="1080" height="760" fill="#fcfcfb"/>
<text x="34" y="44" font-size="21" font-weight="600" fill="#0b0b0b">9 vaccine types cannot be had in a vial smaller than ten doses</text>
<text x="34" y="70" font-size="13.5" fill="#52514e">Each row is a vaccine type; the bar runs from the smallest to the largest vial WHO has prequalified for it. Worst first, top 26 of 56.</text>
<text x="34" y="89" font-size="13.5" fill="#52514e"><tspan font-weight="600" fill="#0b0b0b">An opened multi-dose vial must be used within hours or discarded.</tspan> A type whose bar never reaches 1 leaves a programme no way out of that.</text>
<text x="34" y="108" font-size="13.5" fill="#52514e">All five oral polio variants and BCG are in the orange group &#8212; exactly the vaccines given in outreach settings with low daily turnout.</text>
<text x="34" y="131" font-size="12.5" fill="#8a8880">One capture. 120 of 285 products are 10-dose or larger.</text>
