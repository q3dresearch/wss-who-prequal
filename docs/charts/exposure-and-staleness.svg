<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" font-family='system-ui, -apple-system, "Segoe UI", sans-serif'>
<rect width="1100" height="660" fill="#fcfcfb"/>
<text x="34" y="44" font-size="21" font-weight="600" fill="#0b0b0b">7 vaccine types have one supplier and nothing new prequalified in a decade</text>
<text x="34" y="70" font-size="13.5" fill="#52514e">Each dot is one of the 56 vaccine types WHO prequalifies. Across: years since anything in that type was newly prequalified. Up: how many</text>
<text x="34" y="89" font-size="13.5" fill="#52514e">distinct manufacturers hold prequalification for it.</text>
<text x="34" y="112" font-size="13.5" fill="#52514e"><tspan font-weight="600" fill="#0b0b0b">The shaded corner is the worry list: no alternative supplier, and no refresh in 10+ years.</tspan> Sole-source types are older as a group &#8212; median 8.0y against 3.6y.</text>
<text x="34" y="133" font-size="12.5" fill="#8a8880">One capture, no archive needed. What the archive adds is the date a dot leaves the chart entirely &#8212; WHO records no withdrawals.</text>
