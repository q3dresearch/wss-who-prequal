<text x="34" y="44" font-size="21" font-weight="600" fill="#0b0b0b">The regulator concentration and the maker concentration are the same concentration</text>
<text x="34" y="70" font-size="13.5" fill="#52514e">Prequalified products by who makes them and who vouches for them. Top 9 manufacturers of 51, top 8 regulators of 22 &#8212; 187 of 285 products.</text>
<text x="34" y="89" font-size="13.5" fill="#52514e"><tspan font-weight="600" fill="#0b0b0b">India&#8217;s CDSCO is responsible for 130 products, and 107 of them come from two manufacturers.</tspan> One column carries most of the list.</text>
<text x="34" y="108" font-size="13.5" fill="#52514e">So a regulator-level problem and a manufacturer-level problem would land on the same cells, not on different ones.</text>
