<text x="34" y="540" font-size="12" fill="#8a8880">A problem at the top firm removes 6 vaccine types that have no other prequalified supplier &#8212; not one.</text>
<text x="34" y="557" font-size="12" fill="#8a8880">One capture. WHO records no withdrawals, so the date any of these dots disappears exists only in this archive.</text>
