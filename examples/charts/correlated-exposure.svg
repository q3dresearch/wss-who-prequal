<text x="34" y="44" font-size="21" font-weight="600" fill="#0b0b0b">Those 17 exposed types are really about 9 &#8212; one firm is sole maker for 6</text>
<text x="34" y="70" font-size="13.5" fill="#52514e">The 17 vaccine types with a single prequalified manufacturer, grouped by who that manufacturer is. One dot per type.</text>
<text x="34" y="89" font-size="13.5" fill="#52514e"><tspan font-weight="600" fill="#0b0b0b">Read this with the exposure chart, never instead of it.</tspan> That one counts 17 risks; this one shows they are not independent.</text>
<text x="34" y="112" font-size="13.5" fill="#52514e">Colour is the regulator responsible. Two of the twenty-two cover 16 of 17, so a REGULATOR-level problem is not a product-level problem.</text>
